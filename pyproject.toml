[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-image-pruned"
version = "0.2.0"
description = "Build and verify MiniMax-H3-Image-Pruned: a smaller MiniMax-H3-Image checkpoint that stock Diffusers and Transformers load"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch>=2.5",
    "torchvision",
    "diffusers>=0.42.0.dev0",
    "transformers>=5.22",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "numpy",
]

[project.scripts]
minimax-h3-image-prune = "minimax_h3_image_pruned.prune:main"

[tool.setuptools.packages.find]
where = ["src"]
